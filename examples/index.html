<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD3 视口基础响应式 - @sandlada/breakpoint</title>
  <link rel="stylesheet" href="/src/shared.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>@sandlada/breakpoint</h1>
      <p>场景 1: MD3 标准视口断点与响应式流监听</p>
    </header>

    
  <nav class="nav-tabs">
    <a href="./index.html" class="nav-link active">⚡ MD3 视口基础</a>
    <a href="./element-query.html" class="nav-link ">📦 元素容器断点</a>
    <a href="./custom-conditions.html" class="nav-link ">🎛️ 自定义 & 复合条件</a>
    <a href="./height-observer.html" class="nav-link ">📏 高度与双维度</a>
    <a href="./rxjs-streams.html" class="nav-link ">🔄 RxJS 流与生命周期</a>
  </nav>


    <div class="card">
      <h2>🖥️ 当前视口状态 (Viewport Metrics)</h2>
      <div class="metric-grid">
        <div class="metric-box">
          <div class="metric-label">视口宽度 (Width)</div>
          <div class="metric-value" id="viewport-width">- px</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">当前主断点 (Active)</div>
          <div class="metric-value" id="active-breakpoint" style="color: #38bdf8;">-</div>
        </div>
      </div>

      <h3 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 0.5rem;">MD3 断点匹配情况：</h3>
      <div class="badge-list" id="breakpoint-badges"></div>
    </div>

    <div class="card">
      <h2>📸 同步快照与实时状态 (State Snapshot)</h2>
      <div style="margin-bottom: 1rem;">
        <button id="btn-snapshot">读取同步 snapshot</button>
      </div>
      <pre><code id="state-json">// 等待流推送...</code></pre>
    </div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
